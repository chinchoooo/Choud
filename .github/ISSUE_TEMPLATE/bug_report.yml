name: Bug report
description: Something does not work the way the docs say it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste passwords, tokens, your `.env`, or private file contents.**
        For a security problem use the private report form instead (see SECURITY.md).
        Many first-deployment problems are already explained in `docs/errors.md`.
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Server (API), Storage engine, Web app, Android app, Desktop client, Deployment / scripts, Docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the commit if you run from source (Android app, More > Version).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Your setup
      description: Linux distribution, Docker version, phone model and Android version, how you reach the server (LAN, Tailscale, public address).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs backend --tail 100`, or the Android app's More > Diagnostics log. Remove anything private."
      render: text
