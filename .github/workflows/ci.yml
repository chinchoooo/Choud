name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (ruff + pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Lint
        working-directory: server
        run: ruff check app tests
      - name: Tests
        working-directory: server
        run: pytest -q

  client:
    name: Desktop client (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            client/requirements.txt
      # The client's integration tests run the real server application in-process.
      - run: pip install -r server/requirements.txt -r client/requirements.txt
      - name: Tests
        working-directory: client
        run: pytest -q

  web:
    name: Web (lint, build, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test
        working-directory: web

  engine:
    name: Storage engine (CMake + ctest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev libboost-dev libgtest-dev
      - name: Build
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --parallel
      - name: Test
        run: ctest --test-dir engine/build --output-on-failure

  android:
    name: Android (unit tests + debug build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  deploy-files:
    name: Compose and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh scripts/lib/*.sh deployment/scripts/*.sh server/scripts/*.sh android/tools/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "ok $f"
          done
      - name: Brand assets are up to date
        run: pip install pillow && python scripts/brand/from_sheet.py --check
