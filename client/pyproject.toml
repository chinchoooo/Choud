[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsync"
version = "0.3.0"
description = "Desktop sync client for the Personal Cloud server"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "watchdog>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
cloudsync = "cloudsync.main:main"

[tool.setuptools.packages.find]
include = ["cloudsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from client/ without installing the package or setting PYTHONPATH.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `from __future__ import annotations` keeps `X | None` usable on Python 3.9 in
# annotations; UP007 would also want it in runtime expressions.
ignore = ["UP007"]
