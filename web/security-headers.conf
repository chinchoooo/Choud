# Security headers for the static web app. Included in every location of nginx.conf, because an
# add_header inside a location replaces (does not add to) the ones inherited from the server block.
#
# The CSP lets the page load only its own scripts and styles, talk only to its own origin and frame
# only its own previews (the PDF viewer), and forbids being framed by anyone. style-src keeps
# 'unsafe-inline' because React sets sizes through style attributes (progress bars, image zoom);
# scripts stay strictly 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
